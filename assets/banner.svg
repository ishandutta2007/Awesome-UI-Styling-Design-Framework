<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }
      @keyframes shimmerBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }
      .floating-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-2 { animation: floatRev 7s ease-in-out infinite; }
      .floating-3 { animation: floatSlow 5s ease-in-out infinite; }
      .pulsing-line { animation: pulseGlow 4s ease-in-out infinite; }
      .border-flow { stroke-dasharray: 60, 40; animation: shimmerBorder 25s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .tag-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="240" cy="110" r="220" fill="url(#glow-1)"/>
  <circle cx="960" cy="250" r="240" fill="url(#glow-2)"/>

  <!-- Subtle Tech Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Floating Dynamic Tech Pills (Background / Midground) -->
  <g class="floating-1">
    <!-- Tailwind pill -->
    <g transform="translate(60, 50)">
      <rect width="130" height="34" rx="17" fill="url(#pill-grad)" stroke="#0284c7" stroke-width="1.2" opacity="0.85"/>
      <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
      <text x="34" y="21" fill="#e2e8f0" class="tag-text">Tailwind CSS</text>
    </g>
    <!-- Radix UI pill -->
    <g transform="translate(1010, 60)">
      <rect width="120" height="34" rx="17" fill="url(#pill-grad)" stroke="#a855f7" stroke-width="1.2" opacity="0.85"/>
      <circle cx="20" cy="17" r="5" fill="#c084fc"/>
      <text x="34" y="21" fill="#e2e8f0" class="tag-text">Radix UI</text>
    </g>
  </g>

  <g class="floating-2">
    <!-- shadcn/ui pill -->
    <g transform="translate(50, 270)">
      <rect width="115" height="34" rx="17" fill="url(#pill-grad)" stroke="#64748b" stroke-width="1.2" opacity="0.85"/>
      <circle cx="18" cy="17" r="5" fill="#f8fafc"/>
      <text x="32" y="21" fill="#e2e8f0" class="tag-text">shadcn/ui</text>
    </g>
    <!-- Material UI pill -->
    <g transform="translate(1020, 260)">
      <rect width="130" height="34" rx="17" fill="url(#pill-grad)" stroke="#3b82f6" stroke-width="1.2" opacity="0.85"/>
      <circle cx="20" cy="17" r="5" fill="#60a5fa"/>
      <text x="34" y="21" fill="#e2e8f0" class="tag-text">Material UI</text>
    </g>
  </g>

  <g class="floating-3">
    <!-- Bootstrap pill -->
    <g transform="translate(80, 160)">
      <rect width="110" height="32" rx="16" fill="url(#pill-grad)" stroke="#8b5cf6" stroke-width="1" opacity="0.75"/>
      <circle cx="18" cy="16" r="4" fill="#a78bfa"/>
      <text x="30" y="20" fill="#cbd5e1" class="tag-text">Bootstrap</text>
    </g>
    <!-- DaisyUI pill -->
    <g transform="translate(1030, 160)">
      <rect width="105" height="32" rx="16" fill="url(#pill-grad)" stroke="#10b981" stroke-width="1" opacity="0.75"/>
      <circle cx="18" cy="16" r="4" fill="#34d399"/>
      <text x="30" y="20" fill="#cbd5e1" class="tag-text">DaisyUI</text>
    </g>
  </g>

  <!-- Animated Neon Border Accent -->
  <rect x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" opacity="0.5" class="border-flow"/>

  <!-- Foreground Content Container (Ensures text stays clearly in front) -->
  <g transform="translate(600, 180)" text-anchor="middle">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, -96)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="-116" cy="0" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="6" y="4" fill="#38bdf8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient and Glow -->
    <text y="-25" fill="url(#accent-grad)" font-size="44" class="title-text" filter="drop-shadow(0 2px 12px rgba(56, 189, 248, 0.3))">
      Awesome UI Styling &amp; Design Frameworks
    </text>

    <!-- Subtitle -->
    <text y="20" fill="#cbd5e1" font-size="18" class="subtitle-text">
      The definitive index of CSS frameworks, component libraries &amp; headless accessibility primitives
    </text>

    <!-- Category Pills Underneath Title -->
    <g transform="translate(0, 65)">
      <!-- Pill 1: Utility CSS -->
      <g transform="translate(-255, 0)">
        <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text y="4" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600">⚡ Utility-First CSS</text>
      </g>
      <!-- Pill 2: Headless Primitives -->
      <g transform="translate(-85, 0)">
        <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text y="4" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600">🧩 Headless Primitives</text>
      </g>
      <!-- Pill 3: Component Systems -->
      <g transform="translate(95, 0)">
        <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text y="4" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600">🎨 Component Systems</text>
      </g>
      <!-- Pill 4: Design Tokens -->
      <g transform="translate(265, 0)">
        <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text y="4" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600">📐 Design Tokens</text>
      </g>
    </g>

  </g>
</svg>